# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
#  pull_request_target:
#    types: [opened, reopened, synchronize]
#
  # reusable
  workflow_call:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      TRIGGER_REPO_NAME: ${{ steps.set-env.outputs.TRIGGER_REPO_NAME }}
      TRIGGER_COMMIT_ID: ${{ steps.set-env.outputs.TRIGGER_COMMIT_ID }}
      PR_INFO_FILE: ${{ steps.set-env.outputs.PR_INFO_FILE }}
      SNAPSHOT: ${{ steps.set-env.outputs.SNAPSHOT }}
      CURRENT_ACTION_URL: ${{ steps.set-env.outputs.CURRENT_ACTION_URL }}
      ALL_PR: ${{ steps.parse-dependencies.outputs.ALL_PR }}
      DEPENDS_ON: ${{ steps.parse-dependencies.outputs.DEPENDS_ON }}
    steps:
    - name: Set ENV
      id: set-env
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
          REPO_BASENAME=$(basename "$GITHUB_REPOSITORY")
          echo "TRIGGER_REPO_NAME=$REPO_BASENAME" >> $GITHUB_ENV
          echo "TRIGGER_REPO_NAME=$REPO_BASENAME" >> $GITHUB_OUTPUT
          echo "TRIGGER_COMMIT_ID=$PR_HEAD_SHA" >> $GITHUB_ENV
          echo "TRIGGER_COMMIT_ID=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          echo "PR_INFO_FILE=pr_info_${REPO_BASENAME}_${PR_NUMBER}" >> $GITHUB_ENV
          echo "PR_INFO_FILE=pr_info_${REPO_BASENAME}_${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "SNAPSHOT=snapshot_${REPO_BASENAME}_${PR_NUMBER}" >> $GITHUB_ENV
          echo "SNAPSHOT=snapshot_${REPO_BASENAME}_${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "CURRENT_ACTION_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_ENV
          echo "CURRENT_ACTION_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_OUTPUT

    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: 3.8

    - name: Get Current Action URL
      run: |
        echo "Current Action URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

    - name: Generate App Token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: open-vela

    - name: Parse PR Description for Dependencies
      id: parse-dependencies
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_REPO: ${{ github.repository }}
        PR_NUM: ${{ github.event.pull_request.number }}
        CI_PAT: ${{ steps.app-token.outputs.token }}
      run: |
        set -x
        printf '%s\n' "$PR_BODY" > pull_request.body.txt

        DEPENDS_ON=$(grep -oP 'depends-on:\s*\[[^]]+\]' pull_request.body.txt | sed 's/^ *//;s/ *$//') || true
        echo "PR DEPENDS_ON: $DEPENDS_ON"
        DEPENDS_ON=$(echo "$DEPENDS_ON" | grep -oP '(?<=\[)[^]]+(?=\])') || true
        DEPENDS_ON=$(echo $DEPENDS_ON | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        DEPENDS_ON=$(echo "$DEPENDS_ON" | awk '{for(i=1;i<=NF;i++) if(!a[$i]++) printf "%s%s",$i,(i==NF?ORS:OFS)}')

        VALIDATED_DEPS=""
        for dep in $DEPENDS_ON; do
          if echo "$dep" | grep -qP '^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+/pull/[0-9]+$'; then
            if [[ "$dep" =~ ^open-vela/ ]]; then
              VALIDATED_DEPS="$VALIDATED_DEPS $dep"
            else
              echo "::error::Cross-organization dependencies are forbidden: $dep"
              exit 1
            fi
          else
            echo "::warning::Ignoring invalid depends-on entry: $dep"
          fi
        done
        DEPENDS_ON=$(echo "$VALIDATED_DEPS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

        ALL_PR="$DEPENDS_ON ${PR_REPO}/pull/${PR_NUM}"
        ALL_PR=$(echo $ALL_PR | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        ALL_PR=$(echo "$ALL_PR" | awk '{for(i=1;i<=NF;i++) if(!a[$i]++) printf "%s%s",$i,(i==NF?ORS:OFS)}')
        manifest_part=$(echo "$ALL_PR" | grep -o 'open-vela/manifests[^ ]*') || true
        if [ "$manifest_part"X != ""X ]; then
          without_manifest_pr=$(echo "$ALL_PR" | sed "s|$manifest_part||" | xargs)
          ALL_PR="$manifest_part $without_manifest_pr"
        fi
        echo "ALL_PR=$ALL_PR" >> $GITHUB_ENV
        echo "ALL_PR=$ALL_PR" >> $GITHUB_OUTPUT
        echo "DEPENDS_ON=$DEPENDS_ON" >> $GITHUB_ENV
        echo "DEPENDS_ON=$DEPENDS_ON" >> $GITHUB_OUTPUT
        echo "$TRIGGER_REPO_NAME:$TRIGGER_COMMIT_ID" >> "$PR_INFO_FILE"

        for DEPENDENCY in $DEPENDS_ON; do
          REPO_NAME=$(echo $DEPENDENCY | awk -F'/pull/' '{print $1}')
          PR_NUMBER=$(echo $DEPENDENCY | awk -F'/pull/' '{print $2}')
          PR_COMMITS=$(curl -s -H "Authorization: token ${CI_PAT}" "https://api.github.com/repos/$REPO_NAME/pulls/$PR_NUMBER")
          LATEST_SHA=$(echo "$PR_COMMITS" | jq -r '.head.sha')
          if [[ -z "$LATEST_SHA" ]]; then
            echo "No commits found for PR #$PR_NUMBER or invalid API response."
            exit 1
          fi
          echo "$REPO_NAME:$LATEST_SHA" >> "$PR_INFO_FILE"
          curl -X POST \
            -H "Authorization: token ${CI_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO_NAME/statuses/$LATEST_SHA" \
            -d '{
              "state": "pending",
              "description": "In progress",
              "context": "CI triggered by other PR",
              "target_url": "'"$CURRENT_ACTION_URL"'"
            }'
          COMMENT_BODY="CI started by ${PR_REPO}/pull/${PR_NUM}.\n PR list is $ALL_PR.\n CI url: $CURRENT_ACTION_URL"
          curl -X POST \
            -H "Authorization: token ${CI_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO_NAME/issues/$PR_NUMBER/comments" \
            -d "{\"body\": \"$COMMENT_BODY\"}"
        done

    - name: Download and install repo
      run: |
        mkdir ~/bin
        echo 'export PATH=~/bin:$PATH' >> $HOME/.bashrc
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Clean up disk space
      run: |
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /etc/mysql /etc/php /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a
        sudo docker system prune -af
        sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        df -h

    - name: Verify repo installation
      run: |
        ~/bin/repo --version

    - name: Get PR source branch name
      id: get_branch_name
      run: |
        PR_BRANCH=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
        echo "branch_name=$PR_BRANCH" >> $GITHUB_OUTPUT

    - name: Repo Init
      env:
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        ~/bin/repo init -u https://github.com/open-vela/manifests -b "$PR_BASE_REF" -m openvela.xml --group=default,platform-linux --depth=1 --git-lfs
        echo "REPO_INIT=true" >> $GITHUB_ENV

    - name: Repo Sync
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        df -h
        ~/bin/repo sync -c -d --no-tags -j12
        df -h
        pwd && ls -atl .
        ~/bin/repo manifest -r -o "$SNAPSHOT"

    - name: Archive Snapshot and PR Info
      uses: actions/upload-artifact@v4
      with:
        name: source_info
        path: |
          ${{ env.SNAPSHOT }}
          ${{ env.PR_INFO_FILE }}

  # 并行执行的CI任务矩阵
  ci-tasks:
    needs: setup
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    strategy:
      matrix:
        group: [goldfish, sil, aurix, flagchip, qemu]  # grouped by vendor / platform
        include:
          - group: goldfish
            tasks:
              - goldfish-armeabi-v7a-ap@cmake
              - goldfish-arm64-v8a-ap@cmake
              - goldfish-x86_64-ap@cmake
          - group: sil
            tasks:
              - vendor/openvela/boards/sil/configs/ksil_arm32r_nsh_bl@cmake
              - vendor/openvela/boards/sil/configs/ksil_arm32r_nsh_core0@cmake
              - vendor/openvela/boards/sil/configs/sil_arm32r_nsh_bl@cmake
              - vendor/openvela/boards/sil/configs/sil_arm32r_nsh_core0@cmake
          - group: aurix
            tasks:
              - vendor/infineon/boards/aurix/tc4d9_evb/configs/bl@cmake
              - vendor/infineon/boards/aurix/tc4d9_evb/configs/core0@cmake
              - vendor/infineon/boards/aurix/tc4d9_evb/configs/core1@cmake
              - vendor/infineon/boards/aurix/tc4d9_evb/configs/core2@cmake
              - vendor/infineon/boards/aurix/tc4d9_evb/configs/core3@cmake
              - vendor/infineon/boards/aurix/tc4d9_evb/configs/core4@cmake
              - vendor/infineon/boards/aurix/tc4d9_evb/configs/core5@cmake
          - group: flagchip
            tasks:
              - vendor/flagchip/boards/fc7300/fc7300f8m-evb/configs/bl@cmake
              - vendor/flagchip/boards/fc7300/fc7300f8m-evb/configs/core0@cmake
              - vendor/flagchip/boards/fc7300/fc7300f8m-evb/configs/kbl@cmake
              - vendor/flagchip/boards/fc7300/fc7300f8m-evb/configs/kcore0@cmake
          - group: qemu
            tasks:
              - qemu-arm64-v8a-ap@cmake
              - qemu-arm64-v8a-server@cmake
              - qemu-armeabi-v7a-ap@cmake
              - qemu-armeabi-v7a-bl@cmake
              - qemu-armeabi-v7a-server@cmake
              - qemu-armeabi-v7a-tee@cmake
              - qemu-armeabi-v8m-ap@cmake
      fail-fast: false
    steps:
      - name: Download Snapshot and PR Info
        uses: actions/download-artifact@v4
        with:
          name: source_info
          path: .

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Download and install repo
        run: |
          mkdir ~/bin
          echo 'export PATH=~/bin:$PATH' >> $HOME/.bashrc
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Repo Init
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SNAPSHOT_FILE: ${{ needs.setup.outputs.SNAPSHOT }}
        run: |
          ~/bin/repo init -u https://github.com/open-vela/manifests -b "$PR_BASE_REF" -m openvela.xml --group=default,platform-linux --depth=1 --git-lfs
          cp "$SNAPSHOT_FILE"  .repo/manifests/
          echo "~/bin/repo init -m $SNAPSHOT_FILE --group=default,platform-linux --depth=1 --git-lfs"
          ~/bin/repo init -m "$SNAPSHOT_FILE" --group=default,platform-linux --depth=1 --git-lfs
          echo "REPO_INIT=true" >> $GITHUB_ENV

      - name: Repo Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          df -h
          ~/bin/repo sync -c -d --no-tags -j12
          df -h
          pwd && ls -atl .

      - name: Fetch PR
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALL_PR: ${{ needs.setup.outputs.ALL_PR }}
          PR_INFO_FILE: ${{ needs.setup.outputs.PR_INFO_FILE }}
          SNAPSHOT_FILE: ${{ needs.setup.outputs.SNAPSHOT }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          current_path=$(pwd)
          echo "REPO_ROOT=$current_path" >> $GITHUB_ENV
          echo $(ls -atl)
          git config --global user.email "openvela-robot@xiaomi.com"
          git config --global user.name "openvela-robot"
          set -x
          repo_exist=0
          repo_sync_code=0
          fetch_code=0
          cp_code=0
          code_base_check=0
          fetch_log=$current_path/fetch.log
          cp_log=$current_path/cp.log
          for DEPENDENCY in $ALL_PR; do
            REPO_FULL_PATH=$(echo $DEPENDENCY | awk -F'/pull/' '{print $1}')
            PR_NUMBER=$(echo $DEPENDENCY | awk -F'/pull/' '{print $2}')
            PROJECT_NAME=$(echo $REPO_FULL_PATH | cut -d '/' -f 2)
            PR_COMMIT=$(cat "$PR_INFO_FILE" | grep "${PROJECT_NAME}:" | awk -F':' '{print $2}')
            if [ $PROJECT_NAME == "manifests" ]; then
              cd .repo/manifests
              echo "git fetch origin pull/$PR_NUMBER/head:pr-branch"
              fetch_pr_result=$(git fetch origin pull/$PR_NUMBER/head:pr-branch >> $fetch_log 2>&1)
              fetch_pr_code=$?
              if [ $fetch_pr_code -ne 0 ]; then
                fetch_code=1
                break
              fi
              echo $fetch_pr_result
              git branch -vv
              echo "git merge-base -a pr-branch HEAD"
              common_base_commit=$(git merge-base -a pr-branch HEAD || true)
              if [ "$common_base_commit"X == ""X ]; then
                code_base_check=1
                break
              fi
              echo "git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT)"
              set +e
              cp_pr_result=$(git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT) >> $cp_log 2>&1)
              cp_pr_code=$?
              if [ $cp_pr_code -ne 0 ]; then
                cp_code=1
                break
              fi
              echo $cp_pr_result
              cd -
              ~/bin/repo sync -c -d --no-tags -j12
              if [ $? -ne 0 ]; then
                repo_sync_code=1
                break
              fi
            else
              manifest_content=$(cat ".repo/manifests/$SNAPSHOT_FILE")
              #echo $manifest_content
              REPO_NAME=$(cat ".repo/manifests/$SNAPSHOT_FILE" | grep "\"$PROJECT_NAME\"" | awk -F'name="' '{print $2}' | awk -F'"' '{print $1}')
              if [ "$REPO_NAME"X == ""X ]; then
                repo_exist=1
                break
              fi
              REPO_PATH=$(cat ".repo/manifests/$SNAPSHOT_FILE" | grep "\"$PROJECT_NAME\"" | awk -F'path="' '{print $2}' | awk -F'"' '{print $1}')
              if [ "$REPO_PATH"X == ""X ]; then
                REPO_PATH=$REPO_NAME
              fi
              echo $REPO_PATH
              cd $REPO_PATH
              echo "git fetch openvela pull/$PR_NUMBER/head:pr-branch"
              fetch_pr_result=$(git fetch openvela pull/$PR_NUMBER/head:pr-branch >> $fetch_log 2>&1)
              fetch_pr_code=$?
              if [ $fetch_pr_code -ne 0 ]; then
                fetch_code=1
                break
              fi
              echo $fetch_pr_result
              git branch -vv
              echo "git merge-base -a pr-branch HEAD"
              common_base_commit=$(git merge-base -a pr-branch HEAD || true)
              if [ "$common_base_commit"X == ""X ]; then
                code_base_check=1
                break
              fi
              echo "git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT)"
              set +e
              cp_pr_result=$(git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT) >> $cp_log 2>&1)
              cp_pr_code=$?
              if [ $cp_pr_code -ne 0 ]; then
                cp_code=1
                break
              fi
              echo $cp_pr_result
              cd -
            fi
          done
          echo "REPO_EXIST=$repo_exist" >> $GITHUB_ENV
          echo "REPO_SYNC_CODE=$repo_sync_code" >> $GITHUB_ENV
          echo "FETCH_PR_CODE=$fetch_code" >> $GITHUB_ENV
          echo "CP_PR_CODE=$cp_code" >> $GITHUB_ENV
          echo "CODE_BASE_CHECK=$code_base_check" >> $GITHUB_ENV
        continue-on-error: true

      - name: check cherry-pick pr result
        run: |
          if [ -n "${REPO_SYNC_CODE}" ] && [ ${REPO_SYNC_CODE} != 0 ]; then
            echo "repo sync after cherry-pick manifest PR failed."
            exit 1
          else
            echo "repo sync after cherry-pick manifest PR success."
          fi
          if [ -n "${REPO_EXIST}" ] && [ ${REPO_EXIST}X != 0X ]; then
            echo "repo is not exist, please check."
            exit 1
          fi
          if [ -n "${CODE_BASE_CHECK}" ] && [ ${CODE_BASE_CHECK}X != 0X ]; then
            echo "PR code base need to rebase with source repo."
            exit 1
          fi
          if [ ! -n "${FETCH_PR_CODE}" ] || ([ ${FETCH_PR_CODE}X == 0X ] && [ ${CP_PR_CODE}X == 0X ]) ; then
            echo "cherry-pick PR success and continue."
          else
            if [ ${FETCH_PR_CODE}X != 0X ]; then
              cat ${REPO_ROOT}/fetch.log
              echo "fetch PR failed"
              exit 1
            else
              cat ${REPO_ROOT}/cp.log | grep "is a merge"
              if [ $? -eq 0 ]; then
                echo "There's merge commit in your PR. Please use rebase insteadof merge."
                exit 1
              else
                cat ${REPO_ROOT}/cp.log
                echo "cherry-pick PR failed"
                exit 1
              fi
            fi
          fi

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Pull
        run: |
          docker pull ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx
          df -h

      - name: Clean up disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /etc/mysql /etc/php /opt/hostedtoolcache/CodeQL
          sudo docker builder prune -a
          sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -h

      - name: Run CI tasks inside Docker container
        env:
          CI_WORKSPACE: ${{ github.workspace }}
          CI_MATRIX_GROUP: ${{ matrix.group }}
          CI_TRIGGER_REPO: ${{ needs.setup.outputs.TRIGGER_REPO_NAME }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_TASKS: ${{ join(matrix.tasks, ' ') }}
        run: |
          artifacts=[]
          for task in ${CI_TASKS}; do
            rm -rf output || true
            cmake_flag=""
            cp_base_dir="nuttx"
            echo "=== Starting task: $task ==="
            if [[ "$task" == *@* ]]; then
              cmake_flag="--cmake"
              task=$(echo "$task" | awk -F '@' '{print $1}')
              cp_base_dir="cmake_out/*"
            fi
            if [[ "$task" == *:* ]] || [[ "$task" == *vendor/* ]]; then
              build_cmd="./build.sh $task $cmake_flag -e -Werror -j8"
            else
              build_cmd="./build.sh vendor/openvela/boards/vela/configs/$task $cmake_flag -e -Werror -j8"
            fi
            echo $build_cmd

            docker run --rm \
              -v "${CI_WORKSPACE}":/workspace \
              -w /workspace \
              ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
              /bin/bash -c "pwd && touch $task && df -h && ls -atl && $build_cmd && ls -atl nuttx"

            echo "=== Backup CI results for $task ==="
            ci_artifact_name="${CI_MATRIX_GROUP}/${task//:/_}_${CI_TRIGGER_REPO}-${CI_PR_NUMBER}"
            echo $ci_artifact_name
            mkdir -p $ci_artifact_name || true
            pwd
            ls -atl .
            if [[ "$task" == *:* ]] || [[ "$task" == *vendor/* ]]; then
              cp ${cp_base_dir}/nuttx ${cp_base_dir}/.config $ci_artifact_name
            else
              cp ${cp_base_dir}/nuttx ${cp_base_dir}/.config $ci_artifact_name
              # vela_*.bin is optional: only produced by full-image configs
              # (e.g. goldfish). Configs like qemu-* only produce nuttx ELF.
              cp ${cp_base_dir}/vela_*.bin $ci_artifact_name 2>/dev/null || true
            fi

            echo "=== Cleaning up after $task ==="
            sudo ~/bin/repo forall -v -c 'git clean -dfx; git reset --hard HEAD'  > /dev/null 2>&1 || true
            sudo rm -rf cmake_out || true

            if [[ "$task" == *-citest ]]; then
              echo "Run autotest tasks: $task"
              STANDARD_CONFIG="${task%-citest*}"
              test_model=${STANDARD_CONFIG//-/_}
              echo "pytest -m \"common or $test_model\" ./ -B $STANDARD_CONFIG -L /workspace -P /workspace -F /tmp -R qemu -v --disable-warnings --count=1 --json=/workspace/autotest.json --maxfail=10"
              docker run --rm \
                -v "${CI_WORKSPACE}":/workspace \
                -w /workspace \
                ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
                /bin/bash -c "free -m && df -h && cp $ci_artifact_name/* nuttx/ && ls -atl nuttx && cd tests/scripts/script && pytest -m \"common or $test_model\" ./ -B $STANDARD_CONFIG -L /workspace -P /workspace -F /tmp -R qemu -v --disable-warnings --count=1 --json=/workspace/autotest.json --maxfail=10"
                /bin/bash -c "ls -atl"

              echo "Check autotest result: $task"
              cd "${CI_WORKSPACE}"
              mkdir output
              cp ./*.log ./autotest.json $ci_artifact_name
              failed=$(cat autotest.json | jq '.report.summary.failed')
              if [ "$failed" != "null" ] && [ "$failed" != "0" ]; then
                echo "autotest failed: $failed"
                result="failed"
                exit 1;
              else
                echo "autotest passed"
                result="success"
              fi
            fi
          done

      - name: Archive CI Build Package
        uses: actions/upload-artifact@v4
        with:
          name: Build_Package_${{ matrix.group }}
          path: |
            ${{ matrix.group }}

  # Post-processing job to update dependent PR statuses.
  # Uses needs.ci-tasks.result to aggregate results across all matrix
  # groups: it is "success" only when every matrix instance succeeds;
  # any failure or cancellation in any group makes it "failure".
  post-processing:
    needs: [setup, ci-tasks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: open-vela

      - name: Post Processing
        env:
          CI_TASKS_STATUS: ${{ needs.ci-tasks.result }}
          DEPENDS_ON: ${{ needs.setup.outputs.DEPENDS_ON }}
          CURRENT_ACTION_URL: ${{ needs.setup.outputs.CURRENT_ACTION_URL }}
          CI_PAT: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Job status: ${CI_TASKS_STATUS}"

          if [[ "${CI_TASKS_STATUS}" == "success" ]]; then
            ci_status="success"
          else
            ci_status="failure"
          fi
          for DEPENDENCY in ${DEPENDS_ON}; do
            REPO_NAME=$(echo $DEPENDENCY | awk -F'/pull/' '{print $1}')
            PR_NUMBER=$(echo $DEPENDENCY | awk -F'/pull/' '{print $2}')
            PR_COMMITS=$(curl -s -H "Authorization: token ${CI_PAT}" "https://api.github.com/repos/$REPO_NAME/pulls/$PR_NUMBER")
            LATEST_SHA=$(echo "$PR_COMMITS" | jq -r '.head.sha')
            if [[ -z "$LATEST_SHA" ]]; then
              echo "No commits found for PR #$PR_NUMBER or invalid API response."
              exit 1
            fi
            set -x
            curl -X POST \
              -H "Authorization: token ${CI_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$REPO_NAME/statuses/$LATEST_SHA \
              -d '{
                "state": '"\"$ci_status\""',
                "description": "CI '"$ci_status"'",
                "context": "CI triggered by other PR",
                "target_url": "'"${CURRENT_ACTION_URL}"'"
              }'
            COMMENT_BODY="CI $ci_status. \n PR list is $ALL_PR.\n CI url: ${CURRENT_ACTION_URL}"
            curl -X POST \
              -H "Authorization: token ${CI_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$REPO_NAME/issues/$PR_NUMBER/comments \
              -d "{\"body\": \"$COMMENT_BODY\"}"
            set +x
          done

          # Propagate the aggregated ci-tasks status to this job so that a
          # single required status check on 'post-processing' is sufficient
          # to gate merges. Without this, the job would be green even when
          # any matrix instance failed, because status reporting was only
          # done via curl to dependent PRs.
          if [[ "$CI_TASKS_STATUS" != "success" ]]; then
            echo "::error::CI failed: needs.ci-tasks.result = $CI_TASKS_STATUS"
            exit 1
          fi
