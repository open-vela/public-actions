name: contest-cla-watchdog

# Catch contest PRs whose required cla/signature status was never reported.
#
# The cla workflow in each contest2026* repo posts the cla/signature commit
# status that its ruleset requires for merging. GitHub occasionally drops the
# event that should start that workflow (either the repo stops dispatching
# events altogether, or a single run is created and never scheduled), and the
# PR then sits BLOCKED forever with a permanently pending required check and
# nothing for the contestant to click.
#
# This job scans every open PR in contest2026* repos, and for any whose head
# commit carries no cla/signature status it posts /check-cla -- the documented
# way to re-trigger the check. If a later pass finds the status still missing
# for a head commit we already retried, the repo is dropping events entirely:
# the run then fails with the Actions-reset commands in its job summary,
# because that part needs a human.
#
# Detection intentionally ignores actions/runs counts: GitHub ages old run
# records out, so "zero runs" is also what a merely idle repo looks like.

on:
  schedule:
    - cron: '25 * * * *'   # hourly, offset off the hour to dodge the cron rush
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, never post /check-cla'
        type: boolean
        default: false
      min_age_minutes:
        description: 'Ignore PRs whose head commit is newer than this many minutes'
        default: '30'
      repo_prefix:
        description: 'Repository name prefix to scan'
        default: 'contest2026'
      required_context:
        description: 'Commit status context that must be present'
        default: 'cla/signature'

concurrency:
  group: contest-cla-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Comments must come from a token that is NOT this repo's GITHUB_TOKEN:
      # events triggered by GITHUB_TOKEN never start a new workflow run, so a
      # /check-cla posted with it would be silently inert. An app installation
      # token does trigger workflows and is scoped to the org.
      - name: Generate App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: open-vela

      - name: Scan contest PRs for a missing CLA status
        env:
          # Read path only needs public data, so keep it on the scoped token.
          GH_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.app-token.outputs.token || secrets.CI_PAT_ROBOT }}
          ORG: open-vela
          REPO_PREFIX: ${{ github.event.inputs.repo_prefix || 'contest2026' }}
          REQUIRED_CONTEXT: ${{ github.event.inputs.required_context || 'cla/signature' }}
          MIN_AGE_MINUTES: ${{ github.event.inputs.min_age_minutes || '30' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 .github/scripts/contest_cla_watchdog.py
